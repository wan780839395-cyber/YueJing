name: Device IPA only (tests not run)
run-name: Reading UI device package · TESTS NOT RUN · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      APPROVED_PARENT: 7d55aa5795abcb692af50f37c54c3a51bd841ac3
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Freeze the approved 31-file soft-editorial package and disclose no native test execution
        run: |
          set -euo pipefail
          mkdir -p artifacts/task3
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = "$APPROVED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' '::warning::TESTS NOT RUN in this attempt. Device compilation and packaging only; not full test acceptance.'
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          approved_parent = "7d55aa5795abcb692af50f37c54c3a51bd841ac3"
          assert os.environ["APPROVED_PARENT"] == approved_parent, "Approved parent binding changed"
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1" and os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch", "Only the single authorized manual attempt is accepted"
          assert os.environ["GITHUB_REF"] == "refs/heads/main" and os.environ["GITHUB_REF_NAME"] == "main", "Only the approved main ref is accepted"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          parents = subprocess.check_output(["git", "rev-list", "--parents", "-n", "1", "HEAD"], text=True).split()
          assert head == os.environ["GITHUB_SHA"] and parents == [head, approved_parent], "Candidate SHA or single-parent lineage mismatch"
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True).strip(), "Tracked candidate is dirty"
          allowed = [
              ".github/workflows/ios-build.yml",
              "App/AppVisualStyle.swift",
              "App/ContentView.swift",
              "App/Library/LibraryAppearance.swift",
              "App/Library/LibraryBookRow.swift",
              "App/Library/LibraryCoverPlaceholder.swift",
              "App/Library/LibraryExploreSettings.swift",
              "App/Library/LibraryHeaderView.swift",
              "App/Library/LibraryNavigationShell.swift",
              "App/Library/LibraryPlannedEntriesView.swift",
              "App/Library/LibraryShelfContent.swift",
              "App/Reading/ReaderCompactButtonStyle.swift",
              "App/Reading/ReaderDirectoryChapterRow.swift",
              "App/Reading/ReaderDirectoryFooter.swift",
              "App/Reading/ReaderDirectorySheet.swift",
              "App/Reading/ReaderFloatingToolsView.swift",
              "App/Reading/ReaderPanelHeader.swift",
              "App/Reading/ReaderScreen.swift",
              "App/Reading/ReaderSettingAdjustment.swift",
              "App/Reading/ReaderSettingsSection.swift",
              "App/Reading/ReaderSettingsView.swift",
              "App/Reading/ReaderToolAppearance.swift",
              "App/Reading/ReaderTypographyPreview.swift",
              "App/Reading/ReaderVisualStyle.swift",
              "docs/SOFT_EDITORIAL_UI_LOCAL.md",
              "scripts/check_app_visual_foundation.py",
              "scripts/check_library_navigation_schemes.py",
              "scripts/check_navigation_panel_layout.py",
              "scripts/check_reader_dock_schemes.py",
              "scripts/check_ui_control_cohesion.py",
              "scripts/check_ui_motion_polish.py",
          ]
          changed = subprocess.check_output(["git", "diff", "--name-only", approved_parent, "HEAD"], text=True).splitlines()
          assert len(allowed) == len(set(allowed)) == 31 and len(changed) == 31 and sorted(changed) == sorted(allowed), "Source changes differ from the approved exact 31-file soft-editorial package"
          assert all(Path(path).is_file() and not Path(path).is_symlink() for path in allowed), "Approved candidate file is missing or symlinked"
          frozen_candidates = {
              'App/AppVisualStyle.swift': '16cf61341f3715f7f68f63183e60a5bb7e262a844b51057764d1e2ebd54d12dd',
              'App/ContentView.swift': '9e2a174e3cc90817c3d4f07e0c4bd2bb4014b02c9cc7360ecf4b0c7340830b80',
              'App/Library/LibraryAppearance.swift': '108f3bdb37a8bce0629e5aeb441a33736204463838d744e731bfaaa29e803e28',
              'App/Library/LibraryBookRow.swift': 'd9bc717900536f14d764efa95f86a37de43e001179ad1e57eebc056496a00b7d',
              'App/Library/LibraryCoverPlaceholder.swift': 'de23c8212a8fdf2bfb2f3f24444fe134c12a06722ca7f39b6fc35107e007f26d',
              'App/Library/LibraryExploreSettings.swift': 'bfffceeef45f379326db2bec129d35d18e9f0702becd0469e887d49c31568a5c',
              'App/Library/LibraryHeaderView.swift': 'a5c65ab2da024c2faf5af1244ce0ad4690cb9024b89eff528c0b18b22b6d216b',
              'App/Library/LibraryNavigationShell.swift': 'b4252e275fb98b7c9b74e7a384f8031b3b172854b5bca7f343c5aca52573f9ad',
              'App/Library/LibraryPlannedEntriesView.swift': 'cbdd46d4deeb4ecbc45311b84b48c0b72c2206d3bde96e5224386928fa9941f1',
              'App/Library/LibraryShelfContent.swift': '26bfc70278e90bb717ab3ca460787914806105e40d2c32c66e672b9e1beaf04d',
              'App/Reading/ReaderCompactButtonStyle.swift': '4164058535c95ed2c38a186c33d4c3ba67bb6278e6be7017534dabc01f881be8',
              'App/Reading/ReaderDirectoryChapterRow.swift': 'b66e05fda86173a5274a9395068c8df91aac99932f548a8109a325fb35c9c50d',
              'App/Reading/ReaderDirectoryFooter.swift': '9f030d7d7e81aaa4e47a234d69710bd3de8c6e77b81dd8cb570b48672cf9624a',
              'App/Reading/ReaderDirectorySheet.swift': '100bc762d4b88247c299071090627bce1aee6cbb9ca47907c5b4f99c08350140',
              'App/Reading/ReaderFloatingToolsView.swift': '075e244b5f6ab22189d0a51a54433378ebf644a96fa7aebd85a1da6e0953bc11',
              'App/Reading/ReaderPanelHeader.swift': 'ff6c3835019843b18a0763e4ac222650884684deafd9a0889f34f5a8f5ee0d4c',
              'App/Reading/ReaderScreen.swift': 'e0477e10a2352c2e4102295f3ed2c570fc29bf5a3f5ea273e1fff075f4725ac2',
              'App/Reading/ReaderSettingAdjustment.swift': 'ab2d95afe2cbd2062370bbc00bfc4148c9abf2d4d1b8ffd5b5540aa5b9c66845',
              'App/Reading/ReaderSettingsSection.swift': '840b7e3ebe5cfb1be746fd6f26cd6019a470b6dda66cec581dc864805f7a925f',
              'App/Reading/ReaderSettingsView.swift': '14ca66403e550eb49af0a670ff7b732012405a29e6669cae554daa9da8b472c7',
              'App/Reading/ReaderToolAppearance.swift': 'a8914dd82ef673245a3c5295e6d6cdb5f535cff964f44bf1159ad319287e69c9',
              'App/Reading/ReaderTypographyPreview.swift': '353aeeae89ecdc9ae64963f791edfaaa342bcfab3542c420b45a7206b40200e3',
              'App/Reading/ReaderVisualStyle.swift': '2c2b95410e7300169d294ea078855cc25a7e8403ea07766700adaca6bc9c2883',
              'scripts/check_app_visual_foundation.py': 'a95c45a3160cfbedf24cb57c4d1ab726fa3be94aaea791ba7c1c0880603a8b03',
              'scripts/check_library_navigation_schemes.py': '0eba68feb8aa50000b147d5c983dfeca8370f4cedacf19c3829c6e2fccb0c2f2',
              'scripts/check_navigation_panel_layout.py': '3de95bf7492847ce7bcd248c60c694b9ce240f614c9b05c872895b5b78093dc3',
              'scripts/check_reader_dock_schemes.py': '276254fcd8343db06bb3ed3d246ff5f41556c79cf3a596e8b35c72162515f63d',
              'scripts/check_ui_motion_polish.py': 'd93cdf6fb2c1df5fd59b07b02a2de63fc5d0317559b88f8276ee0e85cf87eeb7',
          }
          assert len(frozen_candidates) == 28 and set(frozen_candidates) == set(allowed) - {'.github/workflows/ios-build.yml', 'scripts/check_ui_control_cohesion.py', 'docs/SOFT_EDITORIAL_UI_LOCAL.md'}, "Frozen candidate scope mismatch"
          assert all(hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected for path, expected in frozen_candidates.items()), "Approved F1/source candidate bytes changed"
          candidate_hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in allowed}
          status = dict(purpose="soft-editorial UI and F1 press-layer device compilation with unsigned packaging",
                        qualification="TESTS NOT RUN",
                        tests_run=False,
                        full_test_gate="not run for this candidate; historical different-source Task3 gate failed",
                        source_commit=os.environ["GITHUB_SHA"],
                        previous_candidate=approved_parent,
                        product_changes=[path for path in allowed if path.startswith(("App/", "Sources/"))],
                        approved_changed_files=allowed,
                        product_change_scope="23 App presentation files implement accepted soft-editorial UI, including F1 press-layer source fix; 6 source checkers, 1 scope document and this workflow updated; Core, Domain, native tests, project and dependencies unchanged",
                        candidate_sha256=candidate_hashes,
                        frozen_f1_candidates=frozen_candidates,
                        ui_candidate=dict(source_commit=os.environ["GITHUB_SHA"], approved_parent=approved_parent, scope="accepted soft-editorial UI and source-closed F1; no claim of native UI, touch or physical-device acceptance", physical_device_acceptance="not performed"),
                        native_tests_this_run=dict(status="not run", executions=0, selection=[]),
                        native_execution=[],
                        prior_validation_source_commit="3b72b9031e62f29a510e603a75f0d5f73744d67e",
                        prior_validation_run=41162425493,
                        prior_validation_attempt=1,
                        prior_validation_url="https://github.com/wan780839395-cyber/YueJing/actions/runs/41162425493",
                        prior_validation_declared=139,
                        prior_validation_selected=138,
                        prior_validation_started=135,
                        prior_validation_finished=135,
                        prior_validation_passed=134,
                        prior_validation_failed=1,
                        prior_validation_unexecuted=3,
                        prior_validation_skipped=0,
                        prior_validation_failure="exit readiness notHittable before actual tap; cause and physical reproduction unknown",
                        prior_validation_applies_to_current_candidate=False,
                        prior_task3_tests_rerun=False,
                        original_task3_gate="unchanged in this batch; not executed",
                        physical_device_acceptance="not performed")
          Path("artifacts/verification-status.json").write_text(json.dumps(status, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("## TESTS NOT RUN\n\nThis attempt only compiles and packages the approved exact 31-file soft-editorial UI candidate. "
                           "Twenty-three App presentation files implement the accepted soft-editorial design and source-closed F1 press-layer fix; six source checkers, one scope document and workflow eligibility/disclosure also changed. Core, Domain, native tests, project and dependencies are unchanged. "
                           "No simulator, unit, host, UI or Canvas tests are executed (`tests_run: false`, native test executions: `0`, selection: `[]`, execution: `[]`). Offline source checks and F1 source closure are not native acceptance. "
                           "Historical different-App-source Task3 run [41162425493](" + status["prior_validation_url"] +
                           ") on `" + status["prior_validation_source_commit"] +
                           "` declared 139 / selected 138 cases, with 135 started and finished: 134 passed / 1 failed / 3 unexecuted / 0 native skipped. This failed history is preserved, not a pass for this new UI candidate. "
                           "Its exit readiness failure occurred before the actual tap; cause and physical reproduction remain unknown, and this package does not claim a bug fix. "
                           "Physical-device acceptance is not performed.\n\n"
                           "Build source: `" + status["source_commit"] + "`; approved single parent: `" +
                           status["previous_candidate"] + "`. The original Task3 workflow is not run or modified in this batch.\n")
          PY
          python3 -B scripts/check_device_build_validation_entry.py

      - name: Verify the selected native toolchain
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -d "$DEVELOPER_DIR"
          {
            printf 'Source: %s\n' "$GITHUB_SHA"
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
          } 2>&1 | tee artifacts/toolchain.log
          grep -Fx 'Xcode 16.4' artifacts/toolchain.log
          grep -Fx 'Build version 16F6' artifacts/toolchain.log
          grep -F 'Apple Swift version 6.1.2 ' artifacts/toolchain.log
          test "$(uname -m)" = arm64

      - name: Verify XcodeGen release and generate the project
        run: |
          set -euo pipefail
          mkdir -p _tooling
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output _tooling/xcodegen.zip
          printf '%s  %s\n' "$XCODEGEN_SHA256" '_tooling/xcodegen.zip' | shasum -a 256 -c -
          ditto -x -k _tooling/xcodegen.zip _tooling
          test -x _tooling/xcodegen/bin/xcodegen
          _tooling/xcodegen/bin/xcodegen --version | tee artifacts/xcodegen.log
          python3 -c 'import os, re, sys; from pathlib import Path; actual = re.findall(r"\b[0-9]+\.[0-9]+\.[0-9]+\b", Path("artifacts/xcodegen.log").read_text()); sys.exit(0 if actual == [os.environ["XCODEGEN_VERSION"]] else "Unexpected XcodeGen version output")'
          _tooling/xcodegen/bin/xcodegen generate --spec project.yml --project . \
            2>&1 | tee artifacts/project-generation.log

      - name: Resolve and verify the official pinned GRDB dependency once
        run: |
          set -uo pipefail
          set +e
          xcodebuild -resolvePackageDependencies -project YueJing.xcodeproj -scheme YueJing \
            -clonedSourcePackagesDirPath build/SourcePackages \
            2>&1 | tee artifacts/dependency-resolution.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/dependency-resolution-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 scripts/validate_task3.py resolved

      - name: Verify Release settings exclude the test-only diagnostics
        run: |
          set -euo pipefail
          xcodebuild -project YueJing.xcodeproj -scheme YueJing -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO -showBuildSettings -json \
            > artifacts/release-build-settings.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          selected = {item["target"]: item["buildSettings"] for item in json.loads(Path("artifacts/release-build-settings.json").read_text())
                      if item["target"] == "YueJing"}
          assert set(selected) == {"YueJing"}, "Missing App settings"
          for target, values in selected.items():
              assert values["CONFIGURATION"] == "Release" and values["SWIFT_VERSION"] == "6.0", target
              assert values["IPHONEOS_DEPLOYMENT_TARGET"] == "16.6" and values["CODE_SIGNING_ALLOWED"] == "NO", target
              assert "DEBUG" not in values.get("SWIFT_ACTIVE_COMPILATION_CONDITIONS", "").split(), target
              assert not re.search(r"(?:^|\s)-D\s*DEBUG(?:\s|$)", values.get("OTHER_SWIFT_FLAGS", "")), target
          Path("artifacts/release-settings-verification.json").write_text(json.dumps(dict(configuration="Release", DEBUG=False, targets=sorted(selected)), indent=2) + "\n")
          PY

      - name: Build one unsigned iPhoneOS arm64 App for device verification only
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project YueJing.xcodeproj \
            -scheme YueJing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/build.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee artifacts/build.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/build-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          exit "${pipeline[1]}"

      - name: Validate device dependencies and package an IPA with TESTS NOT RUN manifest
        id: package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, runpy, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          g = runpy.run_path("scripts/validate_task3.py")
          app, require, run, digest = g["APP"], g["require"], g["run"], g["digest"]
          require(Path("artifacts/build-exit-code.txt").read_text().strip() == "0", "Device build failed")
          g["unsigned"](app)
          require(not list(app.rglob("embedded.mobileprovision")) and not list(app.rglob("_CodeSignature")), "Signing material present")
          import plistlib
          binaries = [app / "YueJing"]
          for name, identity in (("TXTCore", "dev.yuejing.txtcore"), ("ReaderDomain", "dev.yuejing.reader-domain")):
              framework = app / "Frameworks" / (name + ".framework")
              require(framework.is_dir() and not framework.is_symlink(), "Missing embedded framework: " + name)
              info = plistlib.loads((framework / "Info.plist").read_bytes())
              require(info.get("CFBundleIdentifier") == identity and info.get("MinimumOSVersion") == "16.6"
                      and info.get("CFBundleSupportedPlatforms") == ["iPhoneOS"], "Framework metadata mismatch")
          for framework in (app / "Frameworks").glob("*.framework"):
              info = plistlib.loads((framework / "Info.plist").read_bytes())
              binaries.append(framework / info["CFBundleExecutable"])
          binaries += list((app / "Frameworks").glob("*.dylib"))
          images, rpaths, evidence = {}, {}, []
          for binary in binaries:
              require(binary.is_file() and not binary.is_symlink(), "Missing embedded binary")
              require(run(["xcrun", "lipo", "-archs", str(binary)]).split() == ["arm64"], "Non-arm64 binary")
              build = run(["xcrun", "vtool", "-show-build", str(binary)])
              require(re.search(r"^\s*platform IOS\s*$", build, re.MULTILINE), "Not a device image")
              minimum = re.search(r"^\s*minos (\d+)\.(\d+)(?:\.\d+)?\s*$", build, re.MULTILINE)
              require(minimum and tuple(map(int, minimum.groups())) <= (16, 6), "Requires newer iOS")
              g["unsigned"](binary)
              load = run(["xcrun", "otool", "-l", str(binary)])
              rpaths[binary] = re.findall(r"cmd LC_RPATH\s+cmdsize \d+\s+path (.+?) \(offset \d+\)", load)
              images[binary] = [line.strip().split(" (", 1)[0] for line in run(["xcrun", "otool", "-L", str(binary)]).splitlines()[1:] if line.strip()]
          graph = {}
          for binary, links in images.items():
              edges = []
              for link in links:
                  if link.startswith(("/System/Library/", "/usr/lib/")):
                      continue
                  paths = []
                  if link.startswith("@rpath/"):
                      for base in rpaths[binary] + rpaths[binaries[0]]:
                          base = base.replace("@executable_path", str(app)).replace("@loader_path", str(binary.parent))
                          paths.append(Path(base) / link[len("@rpath/"):])
                  elif link.startswith(("@executable_path/", "@loader_path/")):
                      paths.append(Path(link.replace("@executable_path", str(app)).replace("@loader_path", str(binary.parent))))
                  matches = [path.resolve() for path in paths if path.is_file() and path.resolve().is_relative_to(app.resolve())]
                  require(matches and matches[0] in images, "Unresolved dependency: " + link)
                  edges.append(matches[0])
              graph[binary] = edges
              evidence.append(dict(binary=str(binary.relative_to(app)), sha256=digest(binary), dependencies=links))
          reached, pending = set(), [binaries[0]]
          while pending:
              binary = pending.pop()
              if binary not in reached:
                  reached.add(binary)
                  pending.extend(graph[binary])
          require(all(app / "Frameworks" / (name + ".framework") / name in reached for name in ("TXTCore", "ReaderDomain")), "Custom framework not loaded")
          checkout = g["grdb_checkout"]()
          privacy = checkout / "GRDB/PrivacyInfo.xcprivacy"
          resources = [path for path in app.rglob("PrivacyInfo.xcprivacy") if digest(path) == digest(privacy)]
          require(resources, "Missing or changed GRDB privacy resource")
          license_path = app / "GRDB-LICENSE.txt"
          require(license_path.is_file() and digest(license_path) == digest(Path("App/Resources/GRDB-LICENSE.txt"))
                  and digest(license_path) == digest(checkout / "LICENSE"), "GRDB license mismatch")
          report = dict(source_commit=os.environ["GITHUB_SHA"], actual_images=evidence, signing="unsigned",
                        grdb_privacy_resources=[str(path.relative_to(app)) for path in resources],
                        grdb_privacy_sha256=digest(privacy), grdb_license_sha256=digest(license_path),
                        full_test_gate="not passed", purpose="independent device verification only")
          Path("artifacts/device-dependency-verification.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
          python3 scripts/package_ipa.py 2>&1 | tee artifacts/package.log
          python3 - <<'PY'
          import hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path
          out = Path("artifacts")
          app = Path("build/DerivedData/Build/Products/Release-iphoneos/YueJing.app")
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          version = manifest.get("version")
          build = manifest.get("build")
          ipa_name = manifest.get("ipa_file")
          assert isinstance(version, str) and re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*))?", version), "Invalid manifest version"
          assert isinstance(build, str) and re.fullmatch(r"[1-9][0-9]*", build), "Invalid manifest build"
          assert ipa_name == f"YueJing-{version}.ipa" and "TESTS-NOT-RUN" not in ipa_name, "Unexpected manifest IPA filename"
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info.get("CFBundleShortVersionString") == version and info.get("CFBundleVersion") == build, "Manifest version/build differs from built App"
          ipa = out / ipa_name
          assert ipa.is_file() and not ipa.is_symlink(), "Expected packaged IPA is missing"
          assert [path.name for path in out.glob("*.ipa")] == [ipa_name], "Unexpected extra IPA in artifacts"
          expected = {"Payload/YueJing.app/" + path.relative_to(app).as_posix(): path for path in app.rglob("*") if path.is_file()}
          assert "Payload/YueJing.app/Assets.car" in expected and manifest.get("app_icon_files"), "Missing compiled icon resources"
          assert all("Payload/YueJing.app/" + name in expected for name in manifest["app_icon_files"]), "Missing referenced icon PNG"
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)) and archive.testzip() is None, "Duplicate/corrupt IPA entries"
              assert all(name.startswith("Payload/") and ".." not in Path(name).parts for name in names), "Unexpected IPA layout"
              assert {name for name in names if not name.endswith("/")} == set(expected), "Packaged file set differs"
              assert all(archive.read(name) == path.read_bytes() for name, path in expected.items()), "Packaged bytes differ"
          status = json.loads((out / "verification-status.json").read_text(encoding="utf-8"))
          assert status["source_commit"] == manifest["source_commit"], "Package source differs from frozen status"
          assert status["qualification"] == "TESTS NOT RUN" and status["tests_run"] is False
          assert status["native_tests_this_run"] == dict(status="not run", executions=0, selection=[])
          assert status["physical_device_acceptance"] == "not performed"
          manifest.update(status)
          manifest.update(ipa_file=ipa.name, verified_packaged_files=len(expected), device_build="passed",
                          device_dependencies="passed", packaging="passed")
          assert manifest["ipa_bytes"] == ipa.stat().st_size, "IPA size mismatch"
          assert manifest["ipa_sha256"] == hashlib.sha256(ipa.read_bytes()).hexdigest(), "IPA hash mismatch"
          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          names = [ipa.name, "manifest.json", "verification-status.json", "device-dependency-verification.json"]
          (out / "SHA256SUMS").write_text("".join(hashlib.sha256((out / name).read_bytes()).hexdigest() + "  " + name + "\n" for name in names), encoding="utf-8")
          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"ipa_file={ipa.name}\nipa_path=artifacts/{ipa.name}\n")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Preserve this attempt's products and raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reading-ui-TESTS-NOT-RUN-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.ipa_path || 'artifacts/YueJing-*.ipa' }}
            artifacts/manifest.json
            artifacts/verification-status.json
            artifacts/device-dependency-verification.json
            artifacts/release-build-settings.json
            artifacts/release-settings-verification.json
            artifacts/SHA256SUMS
            artifacts/*.log
            artifacts/*-exit-code.txt
            artifacts/task3/
            artifacts/build.xcresult
          retention-days: 3
          if-no-files-found: warn
