name: Device IPA only (tests not run)
run-name: Reading UI device package · TESTS NOT RUN · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      package_scope:
        description: Fixed approved package scope (build only; tests not run)
        required: true
        type: choice
        default: reader-dock-exact8
        options:
          - reader-dock-exact8
          - physical-recovery-32d6244-exact1
          - interaction-diagnostics-2830bd0-exact4
          - host-verified-natural-root-5c88543-exact3
          - c-only-repro-09c61b5-exact1
          - c-dock-failure-1b2117-exact6
          - c-exit-recovery-2f962b6-exact5
          - full146-package-66d1291-exact3
          - bookmark-dock-da2f05a-exact8
      host_validation_run_id:
        description: Fixed prior native run ID required by the selected package scope
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      APPROVED_PARENT: fc3fe1e4818dba7143148a4e781e73c804215d84
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject unapproved package scopes before checkout
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          set -euo pipefail
          case "$PACKAGE_SCOPE" in
            reader-dock-exact8|physical-recovery-32d6244-exact1|interaction-diagnostics-2830bd0-exact4|host-verified-natural-root-5c88543-exact3|c-only-repro-09c61b5-exact1|c-dock-failure-1b2117-exact6|c-exit-recovery-2f962b6-exact5|full146-package-66d1291-exact3|bookmark-dock-da2f05a-exact8) ;;
            *) printf '%s\n' 'Unapproved package_scope' >&2; exit 1 ;;
          esac

      - name: Check out this source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.package_scope == 'interaction-diagnostics-2830bd0-exact4' && 5 || inputs.package_scope == 'physical-recovery-32d6244-exact1' && 4 || 2 }}

      - name: Freeze the approved eight-file reader dock package and disclose no native test execution
        if: ${{ inputs.package_scope == 'reader-dock-exact8' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/task3
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = "$APPROVED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' '::warning::TESTS NOT RUN in this attempt. Device compilation and packaging only; not full test acceptance.'
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from check_ui_control_cohesion import dock_release_gate, DOCK_RELEASE_FIXED
          approved_parent = "fc3fe1e4818dba7143148a4e781e73c804215d84"
          allowed, candidate_hashes = dock_release_gate()
          frozen_candidates = {path: value["sha256"] for path, value in DOCK_RELEASE_FIXED.items()}
          status = dict(purpose="reader dock refinement device compilation with unsigned packaging",
                        qualification="TESTS NOT RUN",
                        tests_run=False,
                        full_test_gate="not run for this candidate; historical different-source Task3 gate failed",
                        source_commit=os.environ["GITHUB_SHA"],
                        previous_candidate=approved_parent,
                        product_changes=[path for path in allowed if path.startswith(("App/", "Sources/"))],
                        approved_changed_files=allowed,
                        product_change_scope="3 fixed reader dock Swift candidates, 3 release/source checkers, 1 scope document and this workflow; bookshelf, settings, Core, Domain, native tests, project, resources and dependencies unchanged",
                        candidate_sha256=candidate_hashes,
                        frozen_f1_candidates=frozen_candidates,
                        ui_candidate=dict(source_commit=os.environ["GITHUB_SHA"], approved_parent=approved_parent, scope="fixed reader dock refinement; no claim of native UI, touch, performance or physical-device acceptance", physical_device_acceptance="not performed"),
                        native_tests_this_run=dict(status="not run", executions=0, selection=[]),
                        native_execution=[],
                        prior_validation_source_commit="3b72b9031e62f29a510e603a75f0d5f73744d67e",
                        prior_validation_run=41162425493,
                        prior_validation_attempt=1,
                        prior_validation_url="https://github.com/wan780839395-cyber/YueJing/actions/runs/41162425493",
                        prior_validation_declared=139,
                        prior_validation_selected=138,
                        prior_validation_started=135,
                        prior_validation_finished=135,
                        prior_validation_passed=134,
                        prior_validation_failed=1,
                        prior_validation_unexecuted=3,
                        prior_validation_skipped=0,
                        prior_validation_failure="exit readiness notHittable before actual tap; cause and physical reproduction unknown",
                        prior_validation_applies_to_current_candidate=False,
                        prior_task3_tests_rerun=False,
                        original_task3_gate="unchanged in this batch; not executed",
                        physical_device_acceptance="not performed")
          Path("artifacts/verification-status.json").write_text(json.dumps(status, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("## TESTS NOT RUN\n\nThis attempt only compiles and packages the approved exact eight-file reader dock candidate. "
                           "Three fixed reader dock Swift candidates, three release/source checkers, one scope document and workflow eligibility/disclosure changed. Bookshelf, settings, Core, Domain, native tests, project, resources and dependencies are unchanged. "
                           "No simulator, unit, host, UI or Canvas tests are executed (`tests_run: false`, native test executions: `0`, selection: `[]`, execution: `[]`). Offline source checks are not native or performance acceptance. "
                           "Historical different-App-source Task3 run [41162425493](" + status["prior_validation_url"] +
                           ") on `" + status["prior_validation_source_commit"] +
                           "` declared 139 / selected 138 cases, with 135 started and finished: 134 passed / 1 failed / 3 unexecuted / 0 native skipped. This failed history is preserved, not a pass for this new UI candidate. "
                           "Its exit readiness failure occurred before the actual tap; cause and physical reproduction remain unknown, and this package does not claim a bug fix. "
                           "Physical-device acceptance is not performed.\n\n"
                           "Build source: `" + status["source_commit"] + "`; approved single parent: `" +
                           status["previous_candidate"] + "`. The original Task3 workflow is not run or modified in this batch.\n")
          PY
          python3 -B scripts/check_device_build_validation_entry.py
          python3 -B scripts/check_reader_dock_schemes.py --device-release-ci > artifacts/reader-dock-source.json
          python3 -B scripts/check_ui_motion_polish.py --device-release-ci > artifacts/reader-dock-motion.json
          python3 -B scripts/check_ui_control_cohesion.py --device-release-ci > artifacts/reader-dock-cohesion.json

      - name: Freeze the fixed parent32 workflow-only package and disclose the failed full regression
        if: ${{ inputs.package_scope == 'physical-recovery-32d6244-exact1' }}
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/task3
          python3 -B - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path

          def physical_recovery_gate_state(env, state):
              parent = "32d6244c7e481de79d74e10a71ecae78635ffc0a"
              workflow = ".github/workflows/ios-build.yml"
              repo = "wan780839395-cyber/YueJing"
              assert env["PACKAGE_SCOPE"] == "physical-recovery-32d6244-exact1", "Unapproved package scope"
              assert env["GITHUB_REPOSITORY"] == repo, "Wrong repository"
              assert env["GITHUB_EVENT_NAME"] == "workflow_dispatch" and env["GITHUB_RUN_ATTEMPT"] == "1", "Manual attempt1 only"
              assert env["GITHUB_REF"] == "refs/heads/main" and env["GITHUB_REF_NAME"] == "main", "Only main accepted"
              assert env["GITHUB_WORKFLOW_REF"] == repo + "/" + workflow + "@refs/heads/main", "Wrong workflow"
              assert state["head"] == env["GITHUB_SHA"] == env["GITHUB_WORKFLOW_SHA"], "Source/workflow SHA mismatch"
              assert state["parents"] == [state["head"], parent], "Only the fixed single parent32 accepted"
              assert not state["dirty"], "Tracked worktree/index must be clean"
              assert state["changed"] == "M\t" + workflow + "\n", "Only one modified workflow accepted"
              before, after = state["before_tree"], state["after_tree"]
              assert set(before) == set(after) and workflow in after, "Tracked path set changed"
              for tree in (before, after):
                  assert tree[workflow][0:2] == ["100644", "blob"], "Workflow must be regular100644"
              assert before[workflow][2] != after[workflow][2], "Workflow blob must change"
              assert {p: v for p, v in before.items() if p != workflow} == {p: v for p, v in after.items() if p != workflow}, "Nonworkflow modes/types/blobs changed"
              assert state["tracked"] == sorted(after), "Index tracked paths differ"
              assert set(state["working"]) == set(after), "Working path set differs"
              for path, entry in after.items():
                  assert entry[0] in ("100644", "100755") and entry[1] == "blob", "Nonregular tracked entry: " + path
                  assert state["working"][path] == dict(regular=True, blob=entry[2]), "Working bytes/symlink differ: " + path
              return dict(source_commit=state["head"], single_parent=parent,
                          approved_changed_files=[workflow], workflow_mode="100644",
                          nonworkflow_tracked_entries_equal=len(after) - 1,
                          nonworkflow_paths_modes_blobs_and_working_bytes_equal=True)

          def git(*args):
              return subprocess.check_output(["git", "--no-optional-locks", *args])

          def tree_at(revision):
              result = {}
              for entry in git("ls-tree", "-r", "-z", revision).split(b"\0"):
                  if entry:
                      meta, path = entry.split(b"\t", 1)
                      result[path.decode("utf-8")] = meta.decode("ascii").split()
              return result

          parent = "32d6244c7e481de79d74e10a71ecae78635ffc0a"
          after = tree_at("HEAD")
          working = {}
          for path in sorted(after):
              file = Path(path)
              regular = stat.S_ISREG(file.lstat().st_mode) and not any(p.is_symlink() for p in (file, *file.parents))
              data = file.read_bytes() if regular else b""
              blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              working[path] = dict(regular=regular, blob=blob)
          state = dict(head=git("rev-parse", "HEAD").decode().strip(),
                       parents=git("rev-list", "--parents", "-n", "1", "HEAD").decode().split(),
                       dirty=git("status", "--porcelain=v1", "--untracked-files=no").decode(),
                       changed=git("diff", "--no-renames", "--name-status", parent, "HEAD").decode(),
                       before_tree=tree_at(parent), after_tree=after,
                       tracked=sorted(p.decode("utf-8") for p in git("ls-files", "-z").split(b"\0") if p),
                       working=working)
          receipt = physical_recovery_gate_state(os.environ, state)
          Path("artifacts/task3/physical-recovery-exact1-gate.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          status = dict(purpose="fixed parent32 product/test bytes; workflow-only child for device verification",
                        qualification="TESTS NOT RUN",
                        qualification_zh="完整回归未通过，供真机验证",
                        tests_run=False,
                        full_test_gate="NOT PASSED; run41261929914 failed on these identical product/test bytes",
                        source_commit=receipt["source_commit"],
                        previous_candidate=parent,
                        product_test_source_commit=parent,
                        product_test_bytes_equal_parent=True,
                        approved_changed_files=receipt["approved_changed_files"],
                        product_changes=[],
                        product_change_scope="none; all nonworkflow tracked paths/modes/blobs and working bytes equal parent32",
                        exact1_gate=receipt,
                        native_tests_this_run=dict(status="not run", executions=0, selection=[]),
                        native_execution=[],
                        prior_validation_source_commit=parent,
                        prior_validation_workflow_id=398234793,
                        prior_validation_run=41261929914,
                        prior_validation_attempt=1,
                        prior_validation_url="https://github.com/wan780839395-cyber/YueJing/actions/runs/41261929914",
                        prior_validation_conclusion="failure",
                        prior_validation_declared=145,
                        prior_validation_selected=144,
                        prior_validation_started=141,
                        prior_validation_finished=141,
                        prior_validation_passed=140,
                        prior_validation_failed=1,
                        prior_validation_unexecuted=3,
                        prior_validation_skipped=0,
                        prior_validation_groups=dict(Core="25 passed", Domain="93 passed", Block="6 passed", serial="1 passed", Host="8 passed", UI="7 passed / 1 failed", Canvas="3 unexecuted"),
                        prior_validation_failure="Tests/YueJingUITests/ReadingFlowUITests.swift:473 shared10s exit/settings hittable wait timed out before actual exit tap; exit exists=true/hittable=false; settings hittable; cause and physical reproduction unknown",
                        prior_validation_applies_to_current_candidate=True,
                        prior_task3_tests_rerun=False,
                        original_task3_gate="unchanged and not executed; no full-pass claim",
                        physical_device_acceptance="not performed")
          Path("artifacts/verification-status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("::warning::TESTS NOT RUN / 完整回归未通过，供真机验证")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## TESTS NOT RUN / 完整回归未通过，供真机验证\n\n"
                           "Build-only attempt: zero native tests; selection `[]`, execution `[]`. Full regression **NOT PASSED**. "
                           "Source commit `" + status["source_commit"] + "` is a workflow-only child, NOT the original32 commit. "
                           "Its unique parent and product/test byte source are `" + parent + "`; every nonworkflow tracked path/mode/blob and working byte is identical. "
                           "The failed full Task3 [run41261929914](" + status["prior_validation_url"] + ") / workflow398234793 / attempt1 applies to these identical product/test bytes: "
                           "145 declared / 144 selected / 141 started and completed; **140 passed / 1 failed / 3 unexecuted / nativeSkip0**. "
                           "Core25, Domain93, Block6, serial1 and Host8 passed; UI7 passed/1 failed; Canvas3 unexecuted. "
                           "ReadingFlowUITests.swift:473: shared10s exit/settings hittable wait timed out BEFORE actual exit tap; exit exists=true/hittable=false; settings hittable. "
                           "Cause and physical reproduction remain unknown. No exit/App-switch/animation bug-fix, native-test, touch, performance or physical-device acceptance claim. "
                           "The original full gate and its failure are preserved, not rerun or waived as a different product source. "
                           "Only Release device compilation and unsigned packaging are attempted here.\n")
          PY
          python3 -B scripts/check_device_build_validation_entry.py
          python3 -B scripts/check_reader_dock_schemes.py --device-release-ci > artifacts/task3/physical-recovery-dock-source.json
          python3 -B scripts/check_ui_motion_polish.py --device-release-ci > artifacts/task3/physical-recovery-motion-source.json
          python3 -B scripts/check_ui_control_cohesion.py --device-release-ci > artifacts/task3/physical-recovery-cohesion-source.json

      - name: Freeze the exact4 passive interaction diagnostics and disclose no full regression pass
        if: ${{ inputs.package_scope == 'interaction-diagnostics-2830bd0-exact4' }}
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/task3
          python3 -B - <<'PY'
          import base64, hashlib, json, os, re, stat, subprocess, zlib
          from pathlib import Path

          PARENT = "2830bd041fb6dc9267d2894c8283e7663dfa128d"
          SCOPE = "interaction-diagnostics-2830bd0-exact4"
          WORKFLOW = ".github/workflows/ios-build.yml"
          REPO = "wan780839395-cyber/YueJing"
          FIXED = {
              "App/Reading/ReaderScreen.swift": "81d04c077efc92bd6b8156814c5d1409e47eeb0345a1b275d167f7f5d04f64ff",
              "App/Reading/ReaderViewport.swift": "5dff5d62d72d561e39a0b39492427ad1850945f309e277216ad25041ea3cbb92",
              "App/Reading/ReaderViewController.swift": "2ecadd2bc68ae7c2232b01d12c4947423df8d52e3e530785849cc3899ccbbce5",
          }
          PREIMAGE = {
              "App/Reading/ReaderScreen.swift": "75207444a56915abfb049fe5ecac423822f80910471520b12e4faa5d97c0e92a",
              "App/Reading/ReaderViewport.swift": "a749022cb0b1d6ab865cb9c3fb8c2c3ff395c5d7492fa307ffa2fbed94b1b52c",
              "App/Reading/ReaderViewController.swift": "f2424be0236346bcda760251137f7d80089373dd5c3e5f18c7472025d9e2a6f6",
          }
          # Lossless original39 ledger, not a source mask; raw bytes are hash-bound before decoding JSON.
          LEDGER_RAW = zlib.decompress(base64.b64decode("", validate=True))
          LEDGER_SHA = "3f1f5ce9cbf4b18d0b25d072356c63089118e3178ff3bc5202a486cda9f05c2a"
          assert hashlib.sha256(LEDGER_RAW).hexdigest() == LEDGER_SHA, "Immutable fragment ledger changed"
          FRAGMENTS = json.loads(LEDGER_RAW)
          assert set(FRAGMENTS) == set(FIXED) and sum(map(len, FRAGMENTS.values())) == 39

          def diagnostic_gate_state(env, state):
              allowed = sorted([WORKFLOW, *FIXED])
              assert env["PACKAGE_SCOPE"] == SCOPE, "Unapproved scope"
              assert env["GITHUB_REPOSITORY"] == REPO, "Wrong repository"
              assert env["GITHUB_EVENT_NAME"] == "workflow_dispatch", "Manual event only"
              assert env["GITHUB_RUN_ATTEMPT"] == "1", "Attempt1 only"
              assert env["GITHUB_REF"] == "refs/heads/main" and env["GITHUB_REF_NAME"] == "main", "Main only"
              assert env["GITHUB_REF_TYPE"] == "branch", "Branch only"
              assert env["GITHUB_WORKFLOW_REF"] == REPO + "/" + WORKFLOW + "@refs/heads/main", "Wrong workflow ref"
              assert state["inputs"] == {"package_scope": SCOPE}, "Unknown or changed dispatch input"
              assert re.fullmatch(r"[0-9a-f]{40}", state["head"]), "Invalid commit"
              assert state["head"] == env["GITHUB_SHA"] == env["GITHUB_WORKFLOW_SHA"], "Source/workflow SHA differs"
              assert state["parents"] == [state["head"], PARENT], "Fixed unique parent2830 only"
              assert not state["dirty"], "Tracked worktree/index dirty"
              assert state["changed"] == "".join("M\t" + p + "\n" for p in allowed), "Exact4 M only"
              before, after = state["before_tree"], state["after_tree"]
              assert len(before) == len(after) == 181 and set(before) == set(after), "Tracked path set changed"
              for path in allowed:
                  assert before[path][:2] == after[path][:2] == ["100644", "blob"], "Exact4 must be regular100644"
                  assert before[path][2] != after[path][2], "Each approved blob must change"
              assert {p:v for p,v in before.items() if p not in allowed} == {p:v for p,v in after.items() if p not in allowed}, "Other177 modes/types/blobs changed"
              assert set(state["index"]) == set(after) == set(state["working"]), "Index/working path set differs"
              for path, entry in after.items():
                  assert entry[0] in ("100644", "100755") and entry[1] == "blob", "Nonregular tracked entry"
                  assert state["index"][path] == [entry[0], entry[2], "0"], "Index mode/blob/stage differs: " + path
                  assert state["working"][path] == dict(regular=True, blob=entry[2]), "Working bytes/symlink differ: " + path
              for path, sha in FIXED.items():
                  data = state["source"][path]
                  assert hashlib.sha256(data).hexdigest() == sha, "Frozen source changed: " + path
                  lines = data.decode("utf-8").splitlines(keepends=True)
                  text = data.decode("utf-8")
                  last = 0
                  for fragment in FRAGMENTS[path]:
                      start, end, value = fragment["start_line"], fragment["end_line"], fragment["text"]
                      assert last < start <= end and text.count(value) == 1, "Fragment overlap/nonunique"
                      assert "".join(lines[start-1:end]) == value, "Fragment placement differs"
                      last = end
                  for fragment in reversed(FRAGMENTS[path]):
                      del lines[fragment["start_line"]-1:fragment["end_line"]]
                  preimage = "".join(lines).encode("utf-8")
                  assert preimage == state["preimage"][path], "Exact reverse differs from Git2830"
                  assert hashlib.sha256(preimage).hexdigest() == PREIMAGE[path], "Preimage hash differs"
              return dict(source_commit=state["head"], product_source_commit=state["head"],
                          business_preimage_commit=PARENT, single_parent=PARENT, approved_changed_files=allowed,
                          frozen_diagnostic_sha256=FIXED, fragment_ledger_sha256=LEDGER_SHA, exact_fragments_reversed=39,
                          preimage_sha256=PREIMAGE, other_tracked_entries_equal=177,
                          index_and_working_equal_commit=True, workflow_id_to_bind=397959305)

          def git(*args):
              return subprocess.check_output(["git", "--no-optional-locks", *args])

          def tree_at(revision):
              result = {}
              for entry in git("ls-tree", "-r", "-z", revision).split(b"\0"):
                  if entry:
                      meta, path = entry.split(b"\t", 1)
                      result[path.decode("utf-8")] = meta.decode("ascii").split()
              return result

          def gather_state():
              after, working, index = tree_at("HEAD"), {}, {}
              for path in sorted(after):
                  file = Path(path)
                  regular = stat.S_ISREG(file.lstat().st_mode) and not any(p.is_symlink() for p in (file, *file.parents))
                  data = file.read_bytes() if regular else b""
                  blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
                  working[path] = dict(regular=regular, blob=blob)
              for entry in git("ls-files", "--stage", "-z").split(b"\0"):
                  if entry:
                      meta, path = entry.split(b"\t", 1)
                      key = path.decode("utf-8")
                      assert key not in index, "Unmerged index"
                      index[key] = meta.decode("ascii").split()
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              return dict(head=git("rev-parse", "HEAD").decode().strip(),
                          parents=git("rev-list", "--parents", "-n", "1", "HEAD").decode().split(),
                          dirty=git("status", "--porcelain=v1", "--untracked-files=no").decode(),
                          changed=git("diff", "--no-renames", "--name-status", PARENT, "HEAD").decode(),
                          before_tree=tree_at(PARENT), after_tree=after, index=index, working=working,
                          source={p:Path(p).read_bytes() for p in FIXED},
                          preimage={p:git("show", PARENT + ":" + p) for p in FIXED}, inputs=event.get("inputs"))

          receipt = diagnostic_gate_state(os.environ, gather_state())
          Path("artifacts/task3/interaction-diagnostics-exact4-gate.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          status = dict(purpose="passive interaction evidence only; not a fix", qualification="TESTS NOT RUN",
                        qualification_zh="仅取证、完整回归未通过，供真机验证", tests_run=False, full_test_gate="NOT PASSED",
                        source_commit=receipt["source_commit"], product_source_commit=receipt["source_commit"],
                        business_preimage_commit=PARENT, previous_candidate=PARENT,
                        product_test_bytes_equal_parent32=False, diagnostic_is_not_a_fix=True,
                        approved_changed_files=receipt["approved_changed_files"], product_changes=sorted(FIXED),
                        product_change_scope="three frozen diagnostic Swift files differ from32; other177 tracked entries equal2830; workflow gate only",
                        exact4_gate=receipt, native_tests_this_run=dict(status="not run", executions=0, selection=[]),
                        native_execution=[], physical_device_acceptance="not performed",
                        prior_validation_source_commit="32d6244c7e481de79d74e10a71ecae78635ffc0a",
                        prior_validation_workflow_id=398234793, prior_validation_run=41261929914,
                        prior_validation_attempt=1, prior_validation_conclusion="failure",
                        prior_validation_url="https://github.com/wan780839395-cyber/YueJing/actions/runs/41261929914",
                        prior_validation_declared=145, prior_validation_selected=144,
                        prior_validation_started=141, prior_validation_finished=141,
                        prior_validation_passed=140, prior_validation_failed=1, prior_validation_unexecuted=3, prior_validation_skipped=0,
                        prior_validation_failure="Tests/YueJingUITests/ReadingFlowUITests.swift:473 shared10s exit/settings hittable wait timed out BEFORE actual exit tap; root cause unknown",
                        prior_Host8_pass="old32 only; not transferred to diagnostic source N",
