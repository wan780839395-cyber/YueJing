          _tooling/xcodegen/bin/xcodegen --version | tee artifacts/task3/xcodegen.log
          grep -Fx 'Version: 2.46.0' artifacts/task3/xcodegen.log
          _tooling/xcodegen/bin/xcodegen generate --spec project.yml --project . 2>&1 | tee artifacts/task3/project-generation.log

