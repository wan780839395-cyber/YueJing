          import json, os, subprocess, time
          from pathlib import Path
          out = Path('artifacts/task3')
          selected = json.loads((out / 'simulator-selection.json').read_text())
          assert selected['udid'] == os.environ['SIMULATOR_UDID']
          command = ['xcrun', 'simctl', 'bootstatus', selected['udid'], '-b']
          started = time.monotonic()
          code, timed_out = None, False
          try:
              with (out / 'simulator-boot.log').open('x') as log:
