name: Task 3 tests and conditional unsigned IPA
run-name: Task 3 validate once · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full regression or the approved exact-two-file Host lifecycle check
        required: true
        type: choice
        default: full
        options:
          - full
          - host-container-root-069a350-exact2

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.validation_scope == 'host-container-root-069a350-exact2' && 2 || 1 }}

      - name: Guard the approved Host-only scope before native preparation
        env:
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'full' }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          BASE = '069a350724f67a8a1c1bd16b49ad9617b99e5600'
          HOST = 'Tests/YueJingHostTests/ReaderSceneAuthorityTests.swift'
          WORKFLOW = '.github/workflows/task3-validate.yml'
          SCOPE = 'host-container-root-069a350-exact2'
          FROZEN = '7832009284e27a45507b2846f7ddb919911dbea7352cd403c10395cd6e5b9d5a'
          def require(ok, message):
              if not ok:
                  raise ValueError(message)
          def validate_host(scope, attempt, event, ref, sha, head, parents, previous, current, blob, worktree, status):
              require(scope == SCOPE, 'Unapproved Host-only scope')
              require(attempt == '1' and event == 'workflow_dispatch' and ref == 'refs/heads/main', 'Host-only run identity differs')
              require(head == sha and parents == [head, BASE] and not status, 'Host-only checkout/unique parent/clean state differs')
              changed = {p for p in set(previous) | set(current) if previous.get(p) != current.get(p)}
              require(changed == {HOST, WORKFLOW}, 'Host-only commit must change exactly the two approved paths')
              require(all(current[p][0:2] == ['100644', 'blob'] for p in changed), 'Host-only paths must be regular 100644 blobs')
              require(len(blob) == 20645 and hashlib.sha256(blob).hexdigest() == FROZEN and worktree == blob, 'Frozen Host blob/worktree differs')
              return dict(scope=scope, qualification='HOST_ONLY_NOT_FULL_REGRESSION', source_commit=sha,
                          parent=BASE, changed_paths=sorted(changed), host_sha256=FROZEN, host_bytes=len(blob),
                          selected=9, full_selected=146, full_passed=False, ui_execution_authorized=False, ipa_authorized=False)
          def git(*args):
              return subprocess.check_output(['git', '-C', os.environ['GITHUB_WORKSPACE'], *args])
          def tree(revision):
              result = {}
              for row in git('ls-tree', '-r', '-z', revision).split(b'\0'):
                  if row:
                      meta, path = row.split(b'\t', 1)
                      result[path.decode('utf-8')] = meta.decode('ascii').split()
              return result
          scope = os.environ['VALIDATION_SCOPE']
          require(scope in ('full', SCOPE), 'Unknown validation scope')
          if scope == SCOPE:
              head = git('rev-parse', 'HEAD').decode().strip()
              receipt = validate_host(scope, os.environ['GITHUB_RUN_ATTEMPT'], os.environ['GITHUB_EVENT_NAME'],
                  os.environ['GITHUB_REF'], os.environ['GITHUB_SHA'], head,
                  git('rev-list', '--parents', '-n', '1', 'HEAD').decode().split(), tree(BASE), tree('HEAD'),
                  git('show', 'HEAD:' + HOST), Path(HOST).read_bytes(), git('status', '--porcelain=v1', '--untracked-files=all'))
              receipt.update(run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
              Path('artifacts/task3').mkdir(parents=True, exist_ok=True)
              with Path('artifacts/task3/host-only-scope.json').open('x', encoding='utf-8') as output:
                  json.dump(receipt, output, indent=2)
              print(json.dumps(receipt))
          else:
              print('Full regression selected; original full gates remain required.')
          PY

      - name: Verify the selected native toolchain
        run: |
          set -euo pipefail
          mkdir -p artifacts/task3
          test -d "$DEVELOPER_DIR"
          {
            printf 'Source: %s\n' "$GITHUB_SHA"
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
          } 2>&1 | tee artifacts/task3/toolchain.log
          grep -Fx 'Xcode 16.4' artifacts/task3/toolchain.log
          grep -Fx 'Build version 16F6' artifacts/task3/toolchain.log
          grep -F 'Apple Swift version 6.1.2 ' artifacts/task3/toolchain.log
          test "$(uname -m)" = arm64

      - name: Verify XcodeGen and generate the project
        run: |
          set -euo pipefail
          mkdir -p _tooling
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output _tooling/xcodegen.zip
          printf '%s  %s\n' "$XCODEGEN_SHA256" '_tooling/xcodegen.zip' | shasum -a 256 -c -
          ditto -x -k _tooling/xcodegen.zip _tooling
          test -x _tooling/xcodegen/bin/xcodegen
          _tooling/xcodegen/bin/xcodegen --version | tee artifacts/task3/xcodegen.log
          python3 -c 'import os, re, sys; from pathlib import Path; actual = re.findall(r"\b[0-9]+\.[0-9]+\.[0-9]+\b", Path("artifacts/task3/xcodegen.log").read_text()); sys.exit(0 if actual == [os.environ["XCODEGEN_VERSION"]] else "Unexpected XcodeGen version")'
          _tooling/xcodegen/bin/xcodegen generate --spec project.yml --project . \
            2>&1 | tee artifacts/task3/project-generation.log

      - name: Resolve the official pinned GRDB dependency once
        run: |
          set -uo pipefail
          set +e
          xcodebuild -resolvePackageDependencies -project YueJing.xcodeproj -scheme YueJing \
            -clonedSourcePackagesDirPath build/SourcePackages \
            2>&1 | tee artifacts/task3/dependency-resolution.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/dependency-resolution-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 scripts/validate_task3.py resolved

      - name: Select an installed arm64 iPhone simulator and verify test targets
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/task3/devices.json
          xcrun simctl list runtimes -j > artifacts/task3/runtimes.json
          python3 scripts/validate_task3.py select-simulator
          python3 scripts/validate_task3.py settings

      - name: Freeze reviewed case inventory and this committed candidate
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -B scripts/task3_test_inventory.py --self-check > artifacts/task3/reviewed-inventory.json.log
          python3 -B scripts/run_reading_ui_tests.py --preflight --self-check > artifacts/task3/app-parser-preflight.json.log
          python3 -B scripts/validate_task3.py freeze-candidate

      - name: Run the original 25 TXTCore tests once
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -uo pipefail
          selection_text="$(python3 -B scripts/task3_test_inventory.py --selection TXTCoreTests)" || exit "$?"
          read -r -a selection <<< "$selection_text"
          set +e
          xcodebuild -project YueJing.xcodeproj -scheme TXTCore -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath build/Task3Tests -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/task3/TXTCoreTests.xcresult \
            -parallel-testing-enabled NO "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee artifacts/task3/TXTCoreTests.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/TXTCoreTests-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 -B scripts/validate_task3.py test-counts TXTCoreTests

      - name: Run 93 ReaderDomain cases (original 89 plus 4 typography cases)
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -uo pipefail
          selection_text="$(python3 -B scripts/task3_test_inventory.py --selection ReaderDomainTests)" || exit "$?"
          read -r -a selection <<< "$selection_text"
          set +e
          xcodebuild -project YueJing.xcodeproj -scheme ReaderDomain -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath build/Task3Tests -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/task3/ReaderDomainTests.xcresult \
            -parallel-testing-enabled NO "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee artifacts/task3/ReaderDomainTests.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/ReaderDomainTests-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 -B scripts/validate_task3.py test-counts ReaderDomainTests

      - name: Run the 6 decoder differential tests and one timed pair in Release
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -uo pipefail
          python3 scripts/validate_task3.py decoder-comparison-settings || exit "$?"
          selection_text="$(python3 -B scripts/task3_test_inventory.py --selection TXTBlockDecoderTests)" || exit "$?"
          read -r -a selection <<< "$selection_text"
          set +e
          xcodebuild -project YueJing.xcodeproj -scheme TXTCore -configuration Release \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath build/Task3DecoderComparison -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/task3/TXTBlockDecoderTests.xcresult \
            -parallel-testing-enabled NO "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee artifacts/task3/TXTBlockDecoderTests.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/TXTBlockDecoderTests-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 -B scripts/validate_task3.py test-counts TXTBlockDecoderTests || exit "$?"
          python3 scripts/validate_task3.py decoder-comparison

      - name: Measure one sequential synthetic reuse path in Release
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -uo pipefail
          python3 scripts/validate_task3.py measurement-settings || exit "$?"
          selection_text="$(python3 -B scripts/task3_test_inventory.py --selection ProcessingReuseMeasurementTests)" || exit "$?"
          read -r -a selection <<< "$selection_text"
          set +e
          xcodebuild -project YueJing.xcodeproj -scheme ReaderDomain -configuration Release \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath build/Task3Measurements -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/task3/ProcessingReuseMeasurementTests.xcresult \
            -parallel-testing-enabled NO "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee artifacts/task3/ProcessingReuseMeasurementTests.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/ProcessingReuseMeasurementTests-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 -B scripts/validate_task3.py test-counts ProcessingReuseMeasurementTests || exit "$?"
          python3 scripts/validate_task3.py processing-measurements

      - name: Confirm the prepared Host-only dependency and frozen selection
        if: ${{ success() && inputs.validation_scope == 'host-container-root-069a350-exact2' }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import task3_test_inventory as inventory
          import validate_task3 as validator
          validator.check_candidate()
          dependency = json.loads(Path('artifacts/task3/dependency-resolution.json').read_text(encoding='utf-8'))
          if dependency['package']['state']['revision'] != '4de97e6903d29697caae1179cdef8479c64c2639' or dependency['checkout_revision'] != '4de97e6903d29697caae1179cdef8479c64c2639':
              raise ValueError('Host-only GRDB revision differs from the approved official 7.0.0 pin')
          scope = json.loads(Path('artifacts/task3/host-only-scope.json').read_text(encoding='utf-8'))
          if scope['source_commit'] != os.environ['GITHUB_SHA'] or scope['run_id'] != os.environ['GITHUB_RUN_ID'] or scope['run_attempt'] != '1':
              raise ValueError('Host-only scope receipt provenance differs')
          names = inventory.expected_names('YueJingHostTests')
          if inventory.COUNTS['YueJingHostTests'] != 9 or len(names) != 9 or inventory.selection('YueJingHostTests') != ['-only-testing:YueJingHostTests']:
              raise ValueError('Host-only exact-nine identity/selection differs')
          print(json.dumps(dict(qualification='HOST_ONLY_NOT_FULL_REGRESSION', selected=9, cases=names,
              ui_execution_authorized=False, device_build=False, ipa=False, full_regression_passed=False)))
          PY

      - name: Run the 8 real App-host UIKit tests once
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 -u scripts/run_reading_ui_tests.py --run --target YueJingHostTests \
            --destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            --evidence-dir artifacts/reading-ui-native

      - name: Audit Host9 and lifecycle warnings without another native invocation
        if: ${{ success() && inputs.validation_scope == 'host-container-root-069a350-exact2' }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import run_reading_ui_tests as runner
          import validate_task3 as validator
          validator.check_candidate()
          out = Path('artifacts/reading-ui-native')
          def load(name):
              return json.loads((out / name).read_text(encoding='utf-8'))
          def require(ok, message):
              if not ok:
                  raise ValueError(message)
          execution = load('YueJingHostTests-execution.json')
          counts = load('YueJingHostTests-counts.json')
          selection = load('YueJingHostTests-selection.json')
          scope = json.loads(Path('artifacts/task3/host-only-scope.json').read_text(encoding='utf-8'))
          for record in (execution, counts, selection, scope):
              require(record['source_commit'] == os.environ['GITHUB_SHA'] and record['run_id'] == os.environ['GITHUB_RUN_ID']
                      and record['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Host-only result provenance differs')
          require(execution['native_exit'] == counts['native_exit'] == 0 and execution['timed_out'] is False, 'Host execution failed or timed out')
          require(int((out / 'YueJingHostTests-exit-code.txt').read_text()) == 0, 'Host raw exit differs')
          require(selection['expected'] == 9 and selection['timeout_seconds'] == 480 and selection['configuration'] == 'Debug', 'Host selection/budget differs')
          command = selection['command']
          require(command == execution['command'] == counts['command'] and command.count('-only-testing:YueJingHostTests') == 1
                  and not any(a.startswith('-only-testing:') and a != '-only-testing:YueJingHostTests' for a in command), 'Non-Host test selection')
          raw = (out / 'YueJingHostTests.log').read_bytes()
          log = raw.decode('utf-8', errors='replace')
          parsed = runner.count_log('YueJingHostTests', log, execution['native_exit'])
          require(len(parsed['passed']) == len(counts['passed']) == 9 and parsed['passed'] == counts['passed']
                  and all(counts[k] == 0 for k in ('failed', 'skipped', 'unexecuted'))
                  and counts['log_sha256'] == hashlib.sha256(raw).hexdigest(), 'Host exact-nine ledger/log differs')
          require(not any(p.name.startswith('YueJingUITests') for p in out.iterdir()), 'Unexpected UI execution evidence')
          require(not list(Path('artifacts').glob('*.ipa')) and not Path('artifacts/manifest.json').exists(), 'Unexpected IPA evidence')
          lines = log.splitlines()
          direct = []
          unbalanced = []
          suite_marker = None
          for number, line in enumerate(lines, 1):
              if re.search(r'\bSuite\b.*\b(?:started|passed|failed)\b', line):
                  suite_marker = dict(line=number, text=line)
              if re.search(r'Calling\s+-viewDid(?:Appear|Disappear):[^\r\n]*directly[^\r\n]*not supported', line):
                  direct.append(dict(line=number, text=line))
              if 'Unbalanced' in line:
                  unbalanced.append(dict(line=number, text=line, nearest_suite_marker=suite_marker,
                      attribution='UNCONFIRMED: nearest suite marker is context, not object ownership',
                      context=[dict(line=i + 1, text=lines[i]) for i in range(max(0, number - 9), min(len(lines), number + 8))]))
          explicit_fixture = [row for row in unbalanced if 'AppearanceContainer' in row['text'] or 'ReaderSceneAuthorityTests' in row['text']]
          audit = dict(qualification='HOST_ONLY_NOT_FULL_REGRESSION', source_commit=os.environ['GITHUB_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt='1', selected=9, actual_passed=len(parsed['passed']),
              native_exit=execution['native_exit'], timed_out=execution['timed_out'], skipped=0,
              direct_lifecycle_misuse=direct, unbalanced=unbalanced, explicit_fixture_unbalanced=explicit_fixture,
              unbalanced_attribution='UNCONFIRMED_REQUIRES_INDEPENDENT_COLLECTION' if unbalanced else 'No Unbalanced lines in this Host log',
              ui_cases_executed=0, device_build=False, ipa=False, full_regression_passed=False,
              limitation='Host-only; scheme may compile UI modules. No App UI flow, device, IPA or full146 acceptance.')
          with Path('artifacts/task3/host-only-audit.json').open('x', encoding='utf-8') as output:
              json.dump(audit, output, indent=2)
          print(json.dumps(audit))
          require(not direct, 'Direct UIKit lifecycle misuse warning remains; stop')
          require(not explicit_fixture, 'Explicit new fixture Unbalanced warning remains; stop')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## HOST_ONLY_NOT_FULL_REGRESSION\nSelected9: actual9 passed, skip0; direct lifecycle misuse warnings0.\n')
              summary.write('Unbalanced lines: ' + str(len(unbalanced)) + '; attribution requires independent collection if present. No blanket all-warning-clear claim.\n')
              summary.write('UI cases0; no device build or IPA; full146 regression NOT run/passed.\n')
          PY

      - name: Run 8 real App UI flows (original 6 plus 2 typography and relaunch cases)
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python3 -u scripts/run_reading_ui_tests.py --run --target YueJingUITests \
            --destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            --evidence-dir artifacts/reading-ui-native

      - name: Run the 3 existing Canvas App-host regressions in the same attempt
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -uo pipefail
          python3 -B scripts/validate_task3.py canvas-settings || exit "$?"
          selection_text="$(python3 -B scripts/task3_test_inventory.py --selection YueJingCanvasTests)" || exit "$?"
          read -r -a selection <<< "$selection_text"
          set +e
          xcodebuild -project YueJing.xcodeproj -scheme YueJingCanvas -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath build/Task3Canvas -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/task3/YueJingCanvasTests.xcresult \
            -parallel-testing-enabled NO "${selection[@]}" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee artifacts/task3/YueJingCanvasTests.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/YueJingCanvasTests-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          if [ "${pipeline[1]}" -ne 0 ]; then exit "${pipeline[1]}"; fi
          python3 -B scripts/validate_task3.py test-counts YueJingCanvasTests

      - name: Require the exact reviewed 144-case union before device App compilation
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -euo pipefail
          python3 scripts/validate_task3.py all-test-gate

      - name: Compile the actual unsigned iPhoneOS arm64 App
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild -project YueJing.xcodeproj -scheme YueJing -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath artifacts/task3/AppBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee artifacts/task3/app-build.log
          pipeline=("${PIPESTATUS[@]}")
          printf '%s\n' "${pipeline[0]}" > artifacts/task3/app-build-exit-code.txt
          if [ "${pipeline[0]}" -ne 0 ]; then exit "${pipeline[0]}"; fi
          exit "${pipeline[1]}"

      - name: Validate embedded dependencies and resources then package the same commit
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        id: package
        run: |
          set -euo pipefail
          python3 scripts/validate_task3.py package-gate 2>&1 | tee artifacts/task3/dependency-gate.log
          python3 scripts/package_ipa.py 2>&1 | tee artifacts/task3/package.log
          python3 scripts/validate_task3.py verify-ipa 2>&1 | tee artifacts/task3/ipa-verification.log
          ipa_file="$(python3 -c 'import json, re; from pathlib import Path; name = json.loads(Path("artifacts/manifest.json").read_text(encoding="utf-8"))["ipa_file"]; assert re.fullmatch(r"YueJing-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*))?\.ipa", name) and "TESTS-NOT-RUN" not in name and (Path("artifacts") / name).is_file(); print(name)')"
          printf 'ipa_file=%s\nipa_path=artifacts/%s\n' "$ipa_file" "$ipa_file" >> "$GITHUB_OUTPUT"

      - name: Preserve raw evidence from this single attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task3-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            artifacts/task3/
            artifacts/reading-ui-native/
          retention-days: 3
          if-no-files-found: warn

      - name: Publish the validated unsigned IPA separately
        if: ${{ success() && (inputs.validation_scope == 'full' || inputs.validation_scope == '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task3-unsigned-ipa-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            artifacts/manifest.json
            artifacts/SHA256SUMS
            artifacts/task3/app-dependency-gate.json
            artifacts/task3/ipa-verification.json
          retention-days: 3
          if-no-files-found: error
