name: YueJing

options:
  minimumXcodeGenVersion: "2.46.0"
  xcodeVersion: "16.4"
  deploymentTarget:
    iOS: "16.6"
  developmentLanguage: zh-Hans

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "16.6"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: "7.0.0"

targets:
  YueJing:
    type: application
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - target: ReaderDomain
      - target: TXTCore
    settings:
      base:
        PRODUCT_NAME: YueJing
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.app
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 阅境
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  TXTCore:
    type: framework
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Sources/TXTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.txtcore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  ReaderDomain:
    type: framework
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Sources/ReaderDomain
    dependencies:
      - target: TXTCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.reader-domain
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  ReaderDomainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Tests/ReaderDomainTests
      - path: Tests/ProcessingReuseMeasurementTests
    dependencies:
      - target: ReaderDomain
      - target: TXTCore
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.reader-domain.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  TXTCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Tests/TXTCoreTests
    dependencies:
      - target: TXTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.txtcore.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  YueJingHostTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Tests/YueJingHostTests
    dependencies:
      - target: YueJing
      - target: ReaderDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.host-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YueJing.app/YueJing"
        BUNDLE_LOADER: "$(TEST_HOST)"

  YueJingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Tests/YueJingUITests
    dependencies:
      - target: YueJing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: YueJing

  YueJingCanvasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Tests/YueJingCanvasTests
    dependencies:
      - target: YueJing
      - target: ReaderDomain
      - target: TXTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.canvas-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YueJing.app/YueJing"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TXTCorePerformanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.6"
    sources:
      - path: Tests/TXTCorePerformanceTests
    dependencies:
      - target: TXTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuejing.txtcore.performance-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  ReaderDomain:
    build:
      targets:
        ReaderDomain: all
        ReaderDomainTests: [test]
    test:
      config: Debug
      targets:
        - ReaderDomainTests

  YueJing:
    build:
      targets:
        YueJing: all
    run:
      config: Debug
    archive:
      config: Release

  TXTCore:
    build:
      targets:
        TXTCore: all
        TXTCoreTests: [test]
    test:
      config: Debug
      targets:
        - TXTCoreTests

  YueJingUI:
    build:
      targets:
        YueJing: all
        YueJingHostTests: [test]
        YueJingUITests: [test]
    test:
      config: Debug
      environmentVariables:
        YUEJING_UI_TEST_SESSION: "D052AE4B-7823-447E-BE63-986028A7F54C"
      targets:
        - name: YueJingHostTests
          parallelizable: false
        - name: YueJingUITests
          parallelizable: false

  TXTCorePerformance:
    build:
      targets:
        TXTCore: all
        TXTCorePerformanceTests: [test]
    test:
      config: Release
      targets:
        - TXTCorePerformanceTests

  YueJingCanvas:
    build:
      targets:
        YueJing: all
        YueJingCanvasTests: [test]
    test:
      config: Debug
      environmentVariables:
        YUEJING_UI_TEST_SESSION: "D052AE4B-7823-447E-BE63-986028A7F54C"
      targets:
        - name: YueJingCanvasTests
          parallelizable: false
